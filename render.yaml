# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: renfe-cercanias-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
